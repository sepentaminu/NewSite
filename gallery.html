<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ashes of Solas - Gallery</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#cf1736",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211114",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background-dark text-white font-display">
<div class="relative min-h-screen flex flex-col">
    <header class="w-full p-6 flex justify-between items-center z-20">
        <a class="flex items-center gap-2" href="index.html">
            <span class="material-symbols-outlined text-primary" style="font-size: 28px;">arrow_back_ios</span>
            <span class="text-white/80 font-medium">Home</span>
        </a>
        <h1 class="text-xl font-bold text-white text-glow uppercase">Gallery</h1>
        <div class="w-12"></div>
    </header>
    <main class="flex-grow p-6 pt-0">
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="aspect-square rounded-xl overflow-hidden">
                <img alt="Dark misty lake with reflections of twisted trees" class="w-full h-full object-cover" src="images/image_11.jpg"/>
            </div>
            <div class="aspect-square rounded-xl overflow-hidden">
                <img alt="Dark gothic castle towers reaching into cloudy sky" class="w-full h-full object-cover" src="images/image_13.jpg"/>
            </div>
            <div class="aspect-square rounded-xl overflow-hidden">
                <img alt="Long dark corridor with gothic arches and dim light" class="w-full h-full object-cover" src="images/image_12.jpg"/>
            </div>
            <div class="aspect-square rounded-xl overflow-hidden">
                <img alt="Futuristic neon city ruins with wires and fog" class="w-full h-full object-cover" src="images/image_15.jpg"/>
            </div>
        </div>
    </main>
    <nav class="fixed bottom-0 w-full bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-white/10 pb-5 pt-3 px-6 z-40">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors" href="index.html">
                <span class="material-symbols-outlined" style="font-size: 24px;">home</span>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors" href="story.html">
                <span class="material-symbols-outlined" style="font-size: 24px;">menu_book</span>
                <span class="text-[10px] font-medium">Story</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors" href="features.html">
                <span class="material-symbols-outlined" style="font-size: 24px;">swords</span>
                <span class="text-[10px] font-bold">Features</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-primary" href="gallery.html">
                <span class="material-symbols-outlined" style="font-size: 24px;">photo_library</span>
                <span class="text-[10px] font-medium">Gallery</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors" href="plan.html">
                <span class="material-symbols-outlined" style="font-size: 24px;">map</span>
                <span class="text-[10px] font-medium">Plan</span>
            </a>
        </div>
    </nav>
</div>
</body>
</html>
